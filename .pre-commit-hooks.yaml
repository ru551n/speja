# pre-commit hooks (https://pre-commit.com). Installing from this repository builds speja
# from source (Rust >= 1.95); see docs/migrating-from-vsg.md for a variant that uses the PyPI wheels.
- id: speja
  name: speja (check)
  description: Report VSG style violations in VHDL files.
  entry: speja
  language: python
  files: \.(vhd|vhdl)$
  require_serial: true
- id: speja-fix
  name: speja (fix)
  description: Fix and format VHDL files like `vsg --fix`.
  entry: speja --fix
  language: python
  files: \.(vhd|vhdl)$
  require_serial: true
