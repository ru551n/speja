# Fuzzing runs on a schedule, not per pull request: it needs nightly Rust and minutes of CPU,
# and its failures are rare. The target is fuzz/fuzz_targets/format.rs.
name: Fuzz

on:
  schedule:
    # 03:17 UTC, daily.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target\nfuzz -> target"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz the formatter
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '300' }}
          TARGETS: format format_config
        # cargo-fuzz defaults to the target it was itself built for, and the prebuilt binary
        # is a musl one, whose static libc the sanitizer cannot use.
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          for target in $TARGETS; do
            cargo fuzz run --target "$host" "$target" -- -max_total_time="$SECONDS_TO_RUN" -timeout=30
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
